name: Build FloatingMenu (dylib + deb)

on:
  push:
    paths:
      - 'FloatingMenu/**'
      - '.github/workflows/build-dylib.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build dylib (arm64e, iOS 14+)
        run: |
          cd FloatingMenu
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun clang \
            -target arm64e-apple-ios14.0 \
            -dynamiclib \
            -fobjc-arc \
            -isysroot "$SDK" \
            -I. \
            entry.m FloatingMenu.m FeatureManager.m Features.m MemoryPatcher.m \
            -framework Foundation \
            -framework UIKit \
            -install_name @executable_path/Frameworks/FloatingMenu.dylib \
            -o FloatingMenu.dylib

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: FloatingMenu.dylib
          path: FloatingMenu/FloatingMenu.dylib

      - name: Install dpkg
        run: brew install dpkg

      - name: Package rootless deb (Sileo maps deb-internal / -> /var/jb)
        run: |
          set -e
          rm -rf pkg && mkdir -p pkg/Library/MobileSubstrate/DynamicLibraries pkg/DEBIAN
          cp FloatingMenu/FloatingMenu.dylib pkg/Library/MobileSubstrate/DynamicLibraries/FloatingMenu.dylib
          cp FloatingMenu/FloatingMenu.plist   pkg/Library/MobileSubstrate/DynamicLibraries/FloatingMenu.plist
          chmod 0755 pkg/Library/MobileSubstrate/DynamicLibraries/FloatingMenu.dylib
          cat > pkg/DEBIAN/control <<'EOF'
          Package: com.example.floatingmenu
          Name: FloatingMenu
          Version: 1.0.0
          Architecture: iphoneos-arm64
          Description: CF in-game floating menu tweak (rootless, iOS 16.6)
          Maintainer: you <you@example.com>
          Depends: ellekit
          Section: Tweaks
          EOF
          dpkg-deb -b pkg FloatingMenu.deb
          ls -la FloatingMenu.deb

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: FloatingMenu.deb
          path: FloatingMenu.deb
